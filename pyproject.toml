[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "young-worker-nics"
version = "0.1.0"
description = "Data pipeline for modelling an employer NICs exemption for young workers aged 18 to 24."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
authors = [
  { name = "PolicyEngine" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "microdf-python>=1.2.0",
]

[project.optional-dependencies]
simulation = [
  # The [uk] extra exact-pins policyengine-uk and policyengine_core, so the
  # bundle version alone determines the whole simulation stack.
  "policyengine[uk]>=4.11.0",
]
lfs = [
  # Step 8 (--lfs-path): the targeted recent-NEET imputation in neet.py.
  # The published results (run 2026-06-20) do not record a microimpute
  # version. This repo dates from 2026-06-11, and 3.1.1 was the newest
  # release from 2026-06-06 to 2026-09-21, so any install for it before
  # then got 3.1.1. The exact pin keeps a rerun on that release rather
  # than the newest one: PolicyEngine is archiving microimpute, and PyPI
  # keeps 3.1.1 installable.
  "microimpute==3.1.1",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
young-worker-nics-build = "young_worker_nics.cli:main"

[project.urls]
Homepage = "https://github.com/PolicyEngine/young-worker-nics"
Repository = "https://github.com/PolicyEngine/young-worker-nics"

[tool.hatch.build.targets.wheel]
packages = ["src/young_worker_nics"]

[tool.hatch.build.targets.sdist]
include = [
  "src/young_worker_nics/**/*.py",
  "tests/**/*.py",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]
