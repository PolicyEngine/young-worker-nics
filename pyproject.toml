[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "young-worker-nics"
version = "0.1.0"
description = "Data pipeline for modelling an employer NICs exemption for young workers aged 18 to 24."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
authors = [
  { name = "PolicyEngine" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "microdf-python>=1.2.0",
]

[project.optional-dependencies]
simulation = [
  # The [uk] extra exact-pins policyengine-uk and policyengine_core, so the
  # bundle version alone determines the whole simulation stack.
  "policyengine[uk]>=4.11.0",
]
lfs = [
  # Step 8 (--lfs-path): the targeted recent-NEET imputation in neet.py fits
  # Microcosm's CategoricalClassifier. Microcosm doesn't publish to PyPI, so
  # all three packages come from one pinned commit of PolicyEngine/microcosm.
  # (Results published before this change record no microimpute version; a
  # fresh install when they ran would have got 3.1.1, which
  # analysis/calibration-shortfall/ runs the published call under.)
  "microcosm-fit @ git+https://github.com/PolicyEngine/microcosm@dc00d158fe429b188c5066db99e7ede94f79cfdf#subdirectory=packages/microcosm-fit",
  "microcosm-frame @ git+https://github.com/PolicyEngine/microcosm@dc00d158fe429b188c5066db99e7ede94f79cfdf#subdirectory=packages/microcosm-frame",
  "microcosm-graph @ git+https://github.com/PolicyEngine/microcosm@dc00d158fe429b188c5066db99e7ede94f79cfdf#subdirectory=packages/microcosm-graph",
]
dev = [
  "hypothesis>=6",
  "packaging",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
young-worker-nics-build = "young_worker_nics.cli:main"

[project.urls]
Homepage = "https://github.com/PolicyEngine/young-worker-nics"
Repository = "https://github.com/PolicyEngine/young-worker-nics"

[tool.hatch.metadata]
# The lfs extra installs Microcosm from a pinned git commit.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/young_worker_nics"]

[tool.hatch.build.targets.sdist]
include = [
  "src/young_worker_nics/**/*.py",
  "tests/**/*.py",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]
